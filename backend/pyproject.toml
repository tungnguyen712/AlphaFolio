[project]
name = "alphafolio-backend"
version = "0.1.0"
description = "AlphaFolio multi-agent stock research backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis[hiredis]>=5.0",
    "celery[redis]>=5.4",
    "anthropic>=0.40",
    "httpx>=0.27",
    "tenacity>=9.0",
    "langgraph>=0.2.40",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-anthropic>=0.2",
    "langsmith>=0.1.130",
    "pyjwt[crypto]>=2.9",
    "structlog>=24.4",
    "python-multipart>=0.0.9",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
